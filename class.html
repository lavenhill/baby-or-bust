  <div class="cover" id="start">
    <h1>我們這一班</h1>
    <p>2018 年，你 26 歲，<br>剛當上「少子女化對策辦公室」的研究助理。<br>同學都叫你「顏座」。<br><br>往左、往右滑，決定國家的托育政策。<br>同學們的日子，會在群組裡告訴你。</p>
    <button class="btn" id="startBtn">打開群組</button>
  </div>
  <div class="endbar hidden" id="endbar"><button class="btn" id="again">再來一次</button><small>@同學追問：接上 AI 後開放</small></div>
</div>
<script>
"use strict";
      var METERS = [
        { key: "births",   name: "出生人口", el: "m-births" },
        { key: "patience", name: "家長耐心", el: "m-patience" },
        { key: "money",    name: "財政",     el: "m-money" }
      ];

      var ENDINGS = {
        "births-low":   "出生人口歸零。產房先空了，這題不用再答了。",
        "patience-low": "家長耐心歸零。連署和抗議包圍行政院，你的政策，沒人再聽了。",
        "patience-high":"家長耐心爆表。期待被你養到無限大，任何政策都變成不夠。",
        "money-low":    "財政歸零。國家沒錢了，立法院把你的預算砍到見骨。",
        "money-high":   "財政爆表。錢多到管不住，查帳的人和監察院一起找上門。"
      };

      /* ================= 卡表 =================
         kind: main 主線 / cons 後果 / event 事件
         fx: {births, patience, money}；debt: 品質債增減（隱藏）        */

      var MAIN = [
        {
          id: "S1", kind: "main", year: "2018", who: "行政院政務委員 林萬億",
          q: "「蓋公立幼兒園要好幾年，爸媽現在就要繳學費。要不要先每月直接發 2,500 元給家長？先解大家的燃眉之急。」",
          left:  { label: "堅持公共化幼兒園", reply: "家長上街，別怪我。", fx: { money: -5, patience: -13 } },
          right: { label: "先發錢給家長", reply: "發錢最快！這個月民調就見效。",     fx: { births: 1, money: -10, patience: 8 } },
          history: "right",
          fact: "現實中，政府選了「先發錢給家長」。其實每月 2,500 元的津貼 2012 年就有，2018 年改的是放寬誰能領；找私立幼兒園合作、多蓋公立幼兒園也同一天上路，三件事一起做。後面每一張卡，都是這個決定寄來的帳單。",
          source: "《我國少子女化對策計畫（107–111 年）》（行政院 2018 年核定）「擴大育兒津貼」：2018 年 8 月起取消父母一方須未就業的限制，2019 年 8 月延到未滿 5 歲，每月 2,500 元；行政院 2018-07-27 新聞稿（林萬億：「不只是發錢了事」）。"
        },
        {
          id: "S2", kind: "main", year: "2018", who: "私立幼兒園業者",
          q: "「我們私立幼兒園願意跟政府合作，學費壓到每月 4,500 以內，馬上多出一堆便宜名額。條件是：政府別常來查我們。」",
          left:  { label: "要合作就得被查", reply: "管這麼死？那我們不玩了。", fx: { money: -7, patience: 2 } },

          history: "right",
          fact: "現實中，政府選了「先合作，承諾少查」。跟政府合作的私立幼兒園，從 2018 學年的 310 家變成 2024 學年的 2,039 家，比一般私立幼兒園還多。便宜名額多了多少？政府公布過 36 萬、52.6 萬、52 萬，但每次算的年份和孩子年齡範圍都不一樣，很難直接比。",
          source: "計畫核定本「建置托育準公共化機制」：私幼簽約加入、家長每月自付不超過 4,500 元（園方收費上限 8,000–10,000 元，差額由政府補）；準公共園數見監察院 2026-04-16 調查簡報。"
        },
        {
          id: "S4", kind: "main", year: "2021", who: "執政黨立委",
          q: "「每月育兒補助從 3,500 加到 5,000，爸媽一定開心。但這筆錢加了就減不回來，以後每年都要付。」",
          left:  { label: "不加，省下來", reply: "不加？民調掉下來誰負責？", fx: { money: 6, patience: -13 } },

          history: "right",
          fact: "現實中，政府選了「加到 5,000」。2021 年 2 月一次拍板：當年 8 月從 2,500 加到 3,500，2022 年 8 月再加到 5,000。",
          source: "行政院 2021-02-04 院會通過少子女化對策計畫 110 年修正案：育兒津貼 2,500 元 → 3,500 元（2021-08）→ 5,000 元（2022-08），就學費用上限降至 3,000 元。"
        },
        {
          id: "S3", kind: "main", year: "2021", who: "私立幼兒園園長",

          left:  { label: "政府直接發錢救園", reply: "老師薪水發得出來了。", fx: { money: -11, patience: 5 } },

          left:  { label: "馬上立法，從嚴", reply: "法過了，執行你們來。", fx: { money: -7, patience: 3 }, debt: -1 },

          history: "left",
          fact: "現實中，立法院選了「馬上立法，從嚴」。新法 2022 年 5 月三讀、6 月公布，2023 年 3 月上路。",
          source: "總統令公布兩法全文（華總一義字第 11100053321 號、第 11100053331 號）。"
        },
        {
          id: "S9", kind: "main", year: "2023", who: "國教署承辦人",
          q: "「一個老師顧 15 個孩子，40 年沒改過。要修法規定降到 1 比 12，還是用補助慢慢引導？修法就得馬上多請老師，可是老師已經很難找了。」",
          left:  { label: "修法規定 1:12", reply: "老師從哪裡變出來？", fx: { money: -4, patience: 4 }, debt: -1 },
          right: { label: "用補助慢慢引導", reply: "反彈壓下來了，慢慢來。", fx: { money: -1, patience: 1 }, debt: 1 },
          history: "right",
          fact: "現實中，政府選了「用補助慢慢引導」。法律上一個老師還是可以顧 15 個 3 到 5 歲的孩子，40 年沒改；1:12 只是公立幼兒園 2023 年 8 月起、合作私幼 2024 年 8 月起的政策目標，沒做到也罰不了。",
          source: "立法院議題研析編號 2819〈幼教師資配置及師生比相關法制之研析〉；教育部 2023-03-30 降低師生比規劃。"
        },
        {
          id: "S10", kind: "main", year: "2024", who: "雙薪家長",

          source: "中央社 2024-01-25〈公幼延長照顧新制上路〉；中央社 2026-08-20〈公立幼兒園延長照顧補助 9月起增至3小時〉。"

        {

  addHTML('<div class="m"><div class="av" style="background-image:url('+A+AV[name]+'.webp)"></div><div><div class="nm">'+esc(name)+'</div><div class="row"><div class="link"><div class="img">'+(NEWS_ICON[id]||"📰")+'</div><div class="tx">'+esc(text)+'<small>新聞連結</small></div></div><div class="t">'+stamp()+'</div></div></div></div>');
}
function sys(text){ addHTML('<div class="sys"><span>'+esc(text)+'</span></div>'); }
function dateLine(text){ addHTML('<div class="date"><span>'+esc(text)+'</span></div>'); }
/* 一串訊息：gap 毫秒間隔；洗版用較短間隔 */
var pending = [];
function burst(list, gap, done){
  list.forEach(function(x,i){ pending.push(setTimeout(function(){ say(x[0],x[1]); if(i===list.length-1 && done) done(); }, i*gap)); });
  if (!list.length && done) done();
}

/* ===== 公告輪播 ===== */
var ann = { list: ["畢業典禮那天的照片，記得補上傳"], i: 0, timer: null };
function annShow(text, flash){ var tx=$("annTx"); tx.style.opacity=0; setTimeout(function(){ tx.textContent=text; tx.style.opacity=1; },250);
  if (flash){ var a=$("ann"); a.classList.remove("flash"); void a.offsetWidth; a.classList.add("flash"); } }
function annStart(){ clearInterval(ann.timer); ann.timer = setInterval(function(){ if(ann.list.length<2) return; ann.i=(ann.i+1)%ann.list.length; annShow(ann.list[ann.i]); }, 4500); }

/* ===== 出生：人數不受選擇影響，只有時間點每局不同 ===== */
function planBirths(){
  var n = rnd(2,6), slots = [rnd(1,2)];
  while (slots.length < n) slots.push(slots[slots.length-1] + rnd(3,4));
  var pool = OTHERS.concat(["家豪","宜君","志豪","佩珊","冠宇","詩涵","宗翰"]).sort(function(){return Math.random()-.5;});
  var who = ["阿芳"].concat(pool.slice(0,n-1));
  return { slots: slots, who: who, born: 0 };
}
function maybeBirth(){
  var b = state.births; if (b.born >= b.slots.length || state.playedCount < b.slots[b.born]) return;
  var name = b.who[b.born]; b.born += 1;
  var msg = (b.born % 2 === 1) ? "本班第 "+b.born+" 位小朋友，猴腮雷啊！🎉" : name+" 上個月喜獲麟兒，我們恭喜他們！🎉";
  ann.list = [msg].concat(ann.list.filter(function(x){ return x.indexOf("🎉")>=0; }).slice(0,1)).concat(["2026 同學會，日期再喬"]);
  ann.i = 0; annShow(msg, true);
}

/* ===== 數值（沿用 play.html，出生不再是指標） ===== */
function freshState(){ return { queue: MAIN.slice(), current:null, busy:false, values:{births:45,patience:80,money:84},
  debt:0, k1Done:false, k9Done:false, firedEvents:{}, eventsFired:0, scandal:false, mainPlayed:0, playedCount:0,
  picks:[], ending:null, year:"2018", births: planBirths() }; }
function checkEnding(){ var v=state.values; if (v.patience<=0) return "patience-low"; if (v.money<=0) return "money-low"; return null; }
function insertCons(id,pos){ var card=CONS[id]; if(!card) return; state.consFired=state.consFired||{}; state.consFired[id]=true; state.queue.splice(Math.min(pos,state.queue.length),0,card); }
function insertConsAfter(id,anchor,fallback){ var k=-1; for(var i=0;i<state.queue.length;i++){ if(state.queue[i].id===anchor){k=i;break;} } insertCons(id, k>=0?k+1:fallback); }
function scheduleConsequences(card, side){
  var t = TRIGGERS[card.id];
  if (t && t[side]) { var cid=t[side][0];
    if (cid==="K1") { if(!state.k1Done){ state.k1Done=true; insertCons("K1",t[side][1]); } } else insertCons(cid,t[side][1]); }
  if (card.id==="S4" && side==="right" && !state.k10Done) { state.k10Done=true; insertCons("K10",1); }
  if (card.id==="S1" && side==="right" && !state.k11Done) { state.k11Done=true; insertCons("K11",0); }
  if (card.id==="S9" && side==="right" && !state.k12Done) { state.k12Done=true; insertCons("K12",1); }
  if (card.id==="S6" && side==="right" && !state.k8Done) { state.k8Done=true; insertConsAfter("K8","S11",1); }
  if (card.id==="S14" && side==="right" && !state.k13Done) { state.k13Done=true; insertConsAfter("K13","S12",1); }
  if (!state.k9Done && state.values.money <= 25) { state.k9Done = true; state.queue.unshift(CONS.K9); }
  if (card.id !== "S8" && state.eventsFired < 2) {
    var ev=null;
    if (!state.firedEvents.E3 && state.mainPlayed>=3 && state.values.money<=20) ev=EVENTS.E3;
    else if (!state.firedEvents.E1 && state.mainPlayed>=4 && state.debt>=3) ev=EVENTS.E1;
    else if (!state.firedEvents.E2 && !(state.consFired&&state.consFired.K4) && state.mainPlayed>=4 && state.debt>=5) ev=EVENTS.E2;
    if (ev) { state.firedEvents[ev.id]=true; state.eventsFired+=1; state.queue.unshift(ev); }
  }
}
function resolve(side){
  var c = state.current, opt = c[side];
  var prevSide = state.picks.length ? state.picks[state.picks.length-1].side : null;
  var swingTax = (prevSide && prevSide !== side) ? -4 : 0;
  if (opt.debt) state.debt = Math.max(0, state.debt + opt.debt);
  var e1Extra = (c.id==="E1" && side==="right" && state.debt>=4) ? -6 : 0;
  state.picks.push({card:c, side:side});
  var cardNo = state.playedCount + 1, inflation = cardNo <= 6 ? -2 : -3, scandalExtra = state.scandal ? -1 : 0;
  for (var k in opt.fx) state.values[k] += opt.fx[k];
  state.values.patience += swingTax + e1Extra + inflation + scandalExtra;
  state.values.births -= 2;
  state.playedCount += 1; if (c.kind==="main") state.mainPlayed += 1;
  renderOrbs();
  state.ending = checkEnding();
  if (!state.ending) scheduleConsequences(c, side);
}

/* ===== 圓球 ===== */
var orbF = $("orbF"), orbP = $("orbP");
function renderOrbs(){
  [["money",orbF],["patience",orbP]].forEach(function(p){ var v=Math.max(0,Math.min(100,state.values[p[0]]));
    p[1].querySelector(".lv").style.height = v+"%"; p[1].classList.toggle("danger", v<=20); });
}
function orbsHome(){ [orbF,orbP].forEach(function(o){ o.classList.remove("jump"); }); $("dim").classList.remove("on"); }
function orbsFloat(side){
  var fx = state.current[side].fx;
  [["money",orbF],["patience",orbP]].forEach(function(p,i){
    var o=p[1], amp = Math.abs(fx[p[0]]||0);
    o.classList.remove("jump"); void o.offsetWidth;
    o.style.setProperty("--h", Math.min(48, amp*3.6)+"px");
    o.classList.toggle("jump", amp>0);
  });
  $("dim").classList.add("on");
}

/* ===== 卡片 ===== */
function art(c){ var p = PORTRAIT[c.id]; return A + ((p && p.acc) || "sign") + ".webp"; }
function drawCard(){
  var c = state.queue.shift(); state.current = c;
  if (c.kind === "event") state.scandal = true;
  if (c.year && c.year !== state.year) { state.year = c.year; dateLine(c.year+" 年"); }
  $("yr").textContent = state.year;
  var L = LINES[c.id];
  if (L && L.pre) news(L.pre[0], L.pre[1], c.id);
  var d = $("slot");
  d.innerHTML = '<div class="card'+(c.kind==="event"?" ev":"")+'" id="card"><div class="lab l" id="labL">'+esc(c.left.label)+'</div><div class="lab r" id="labR">'+esc(c.right.label)+'</div>'
    + '<div class="who">'+esc(c.who)+'</div><div class="q">'+esc(c.q)+'</div><div class="art" style="background-image:url('+art(c)+')"></div>'
    + (state.playedCount===0?'<div class="hint">← 往左或往右滑 →</div>':'')+'</div>';
  var card = $("card");
  card.style.transform = "translateY(40px) scale(.96)"; card.style.opacity = 0; void card.offsetWidth;
  card.style.transition = "transform .3s ease, opacity .3s"; card.style.transform = "none"; card.style.opacity = 1;
  bindDrag(card);
  setTimeout(function(){ state.busy = false; }, 300);
}
function commit(side){
  if (state.busy) return; state.busy = true;
  var card = $("card"), dir = side==="left" ? -1 : 1, c = state.current;
  card.style.transition = "transform .3s ease-in, opacity .3s"; card.style.opacity = 0;
  card.style.transform = "translateX("+(dir*480)+"px) rotate("+(dir*24)+"deg)";
  orbsHome();
  resolve(side);
  var L = LINES[c.id], lines = (L && L[side]) || [], flood = lines.length > 2;
  maybeBirth();
  if (state.ending) { burst(lines, 300, function(){ setTimeout(death, 700); }); $("slot").innerHTML=""; return; }
  if (!state.queue.length) { burst(lines, flood?260:400, function(){ setTimeout(reunion, 900); }); setTimeout(function(){ $("slot").innerHTML=""; },300); return; }
  burst(lines, flood?260:400);
  setTimeout(drawCard, flood ? 260*lines.length : 280);   /* 回話與下一張卡同時出現；洗版時等洗完 */
}

/* 拖曳 */
function bindDrag(card){
  var startX=0, dx=0, down=false, shown=null;
  function setDrag(x){
    dx = x; var w = card.offsetWidth, ratio = Math.max(-1, Math.min(1, dx/(w*0.6)));
    card.style.transform = "translateX("+(dx*0.35)+"px) rotate("+(ratio*8)+"deg)";
    $("labL").style.opacity = ratio<0 ? Math.min(1,-ratio*2) : 0;
    $("labR").style.opacity = ratio>0 ? Math.min(1, ratio*2) : 0;
    var s = Math.abs(ratio) > .12 ? (ratio<0?"left":"right") : null;
    if (s !== shown){ shown = s; if (s) orbsFloat(s); else orbsHome(); }
  }
  card.addEventListener("pointerdown", function(e){ if(state.busy) return; down=true; startX=e.clientX; dx=0; shown=null;
    card.setPointerCapture(e.pointerId); card.style.transition="none"; });
  card.addEventListener("pointermove", function(e){ if(down) setDrag(e.clientX-startX); });
  function up(){ if(!down) return; down=false;
    if (Math.abs(dx) > card.offsetWidth*0.35) commit(dx<0?"left":"right");
    else { card.style.transition="transform .25s"; card.style.transform="none"; $("labL").style.opacity=0; $("labR").style.opacity=0; orbsHome(); shown=null; } }
  card.addEventListener("pointerup", up); card.addEventListener("pointercancel", up);
  card._setDrag = setDrag;
}
document.addEventListener("keydown", function(e){
  if (!state || state.busy || !$("start").classList.contains("hidden")) return;
  var card = $("card"); if (!card) return;
  if (e.key==="ArrowLeft"||e.key==="ArrowRight"){ var s=e.key==="ArrowLeft"?"left":"right";
    card._setDrag((s==="left"?-1:1)*card.offsetWidth*0.4); setTimeout(function(){ commit(s); },220); }
});

/* ===== 倒下與同學會 ===== */
function death(){
  var d = DEATH[state.ending];
  burst(d.flood, 260, function(){ setTimeout(function(){ sys(d.sys); setTimeout(reunion, 1600); }, 500); });
}
function reunion(){
  $("orbs").classList.add("hidden");
  dateLine("2026 年・同學會"); state.year = "2026"; $("yr").textContent = "2026";
  if (state.ending) sys("阿芳 邀請 顏座 加入群組");
  var n = state.births.born;
  var lines = [["阿芳","各位，同學會辦完啦，謝謝大家來！"],["阿芳","算了一下，八年來我們班一共 "+n+" 個小朋友"],["阿芳","老顏，不管大家對你的感想怎麼樣，你都是我們的好同學"]];
  burst(lines, 900, function(){ setTimeout(function(){ $("endbar").classList.remove("hidden"); }, 600); });
}

/* ===== 開局 ===== */
var state = null;
function startGame(){
  pending.forEach(clearTimeout); pending = [];
  state = freshState(); state.busy = true;
  room.innerHTML = ""; clock = { h: 20, m: rnd(0,20) };
  ann.list = ["畢業典禮那天的照片，記得補上傳"]; ann.i = 0; annShow(ann.list[0]); annStart();
  $("start").classList.add("hidden"); $("endbar").classList.add("hidden"); $("slot").innerHTML = "";
  $("orbs").classList.remove("hidden"); renderOrbs(); orbsHome(); $("yr").textContent = "2018";
  dateLine("2018 年");
  burst(LINES.OPEN, 700, function(){ setTimeout(drawCard, 500); });
}
$("startBtn").addEventListener("click", startGame);
$("again").addEventListener("click", startGame);
orbsHome();

</script>
