<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>少子女化拯救器 Baby or Bust</title>
<style>
  :root{
    --bar:#2b2420; --bar-ink:#e9dcc3; --icon-empty:#5a4d43; --icon-full:#f1e4c9;
    --bg:#b9a582; --card-back:#3a3029; --ink:#2b2420; --cream:#efe4cc;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bar);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;color:var(--ink);overflow:hidden;user-select:none}
  .app{position:relative;max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
  /* top bar */
  .topbar{background:var(--bar);padding:14px 18px 16px;display:flex;justify-content:space-around;align-items:flex-end;position:relative}
  .stat{position:relative;width:52px;display:flex;flex-direction:column;align-items:center}
  .dot{height:14px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
  .dot i{display:block;border-radius:50%;background:var(--icon-full);transform:scale(0);transition:transform .15s}
  .dot i.small{width:7px;height:7px}.dot i.big{width:13px;height:13px}
  .dot i.on{transform:scale(1)}
  .stat svg{width:44px;height:44px;display:block}
  .stat .lbl{font-size:11px;color:var(--bar-ink);opacity:.7;margin-top:4px;letter-spacing:.1em}
  .stat.flash-up svg{animation:fu .6s}.stat.flash-down svg{animation:fd .6s}
  @keyframes fu{50%{filter:drop-shadow(0 0 6px #b6e39a)}}
  @keyframes fd{50%{filter:drop-shadow(0 0 6px #e8735a)}}
  .stat.danger svg{animation:pulse 1.2s infinite}
  @keyframes pulse{50%{filter:drop-shadow(0 0 5px #e8735a)}}
  .debt{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-size:11px;color:#4a3d33;opacity:0;transition:opacity 1s}
  .debt.on{opacity:.75}
  /* question */
  .question{flex:0 0 auto;min-height:128px;padding:30px 26px 10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;line-height:1.6;color:var(--ink)}
  /* card stage */
  .stage{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;perspective:1200px;min-height:300px}
  .deck,.card{position:absolute;width:min(76vw,300px);aspect-ratio:1/1;border-radius:10px}
  .deck{background:var(--card-back);transform:translateY(6px);box-shadow:0 10px 24px rgba(0,0,0,.25)}
  .deck::after,.back::after{content:"";position:absolute;inset:14px;border:2px solid #5a4b3f;border-radius:6px;
    background:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.035) 10px 20px)}
  .card{cursor:grab;touch-action:none;transform-style:preserve-3d;will-change:transform}
  .card.dragging{cursor:grabbing}
  .face,.back{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;overflow:hidden}
  .face{background:var(--cream);box-shadow:0 10px 24px rgba(0,0,0,.28)}
  .back{background:var(--card-back);transform:rotateY(180deg)}
  .face svg.portrait{width:100%;height:100%;display:block}
  .choice{position:absolute;left:0;right:0;top:0;padding:16px 18px 34px;font-size:17px;font-weight:700;color:#fff;
    background:linear-gradient(rgba(30,22,16,.88),rgba(30,22,16,.72) 70%,transparent);opacity:0;pointer-events:none}
  .choice.l{text-align:left}.choice.r{text-align:right}
  .who{flex:0 0 auto;text-align:center;font-size:15px;letter-spacing:.12em;padding:14px 10px 0;color:#3a2f27;font-weight:700}
  .bottom{flex:0 0 auto;text-align:center;padding:12px 0 22px;color:#3a2f27}
  .bottom .yr{font-size:22px;letter-spacing:.2em}
  .bottom .sub{font-size:12px;opacity:.7;margin-top:2px;letter-spacing:.15em}
  .hint{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:11px;opacity:.55}
  /* overlays */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:20;background:var(--bar);color:var(--bar-ink)}
  .screen.hidden{display:none}
  .screen h1{font-size:30px;letter-spacing:.15em;margin-bottom:6px}
  .screen .en{font-size:13px;letter-spacing:.4em;opacity:.6;margin-bottom:26px}
  .screen p{font-size:15px;line-height:1.8;opacity:.85;max-width:340px}
  .btn{margin-top:30px;background:none;border:2px solid var(--bar-ink);color:var(--bar-ink);font:inherit;font-size:16px;letter-spacing:.3em;padding:10px 28px;border-radius:4px;cursor:pointer}
  .btn:hover{background:var(--bar-ink);color:var(--bar)}
  .end{justify-content:flex-start;overflow-y:auto}
  .end .death{font-size:19px;line-height:1.7;margin:30px 0 8px;max-width:360px}
  .end .meta{font-size:13px;opacity:.6;letter-spacing:.15em}
  .log{list-style:none;text-align:left;margin-top:26px;width:100%;max-width:380px}
  .log li{border-top:1px solid #4a3e35;padding:12px 0;font-size:13px;line-height:1.7}
  .log .h{opacity:.6;font-size:12px}
  .log .pick{font-weight:700}
  .log .fact{opacity:.75;margin-top:4px}
  .tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:3px;margin-left:6px;border:1px solid currentColor;opacity:.8}
  .question.reply{font-weight:700;color:#5a2a1a;animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
  .bill{width:100%;max-width:380px;margin-top:22px;padding:14px 16px;border:2px solid #5a2a1a;border-radius:8px;text-align:left;background:rgba(255,255,255,.35)}
  .bill .bh{font-weight:700;letter-spacing:.1em;margin-bottom:8px;color:#5a2a1a}
  .bill .br{font-size:14px;line-height:1.7}.bill .br b{display:inline-block;width:3.2em}
  .bill .bt{margin-top:8px;padding-top:8px;border-top:1px dashed #5a2a1a;font-weight:700;font-size:14px;line-height:1.6}
  /* ===== 主題：兔兔版（整包切換，不與經典版混用）===== */
  @font-face{font-family:"BOBHuninn1";src:url("assets/fonts/huninn-1.woff2") format("woff2");font-display:swap}
  @font-face{font-family:"BOBHuninn2";src:url("assets/fonts/huninn-2.woff2") format("woff2");font-display:swap}
  @font-face{font-family:"BOBHuninn3";src:url("assets/fonts/huninn-3.woff2") format("woff2");font-display:swap}
  body.theme-bunny{--bar:#ffd9cf;--bar-ink:#8a5a4a;--icon-empty:#f3dcd2;--icon-full:#ee8f9b;--bg:#fff6ec;--card-back:#ffc9c2;--ink:#6e5046;--cream:#fffdf8;
    font-family:"BOBHuninn1","BOBHuninn2","BOBHuninn3","PingFang TC","Microsoft JhengHei",sans-serif}
  body.theme-bunny .app{background:radial-gradient(circle at 15% 20%,#ffe6e6 0 18px,transparent 19px),radial-gradient(circle at 85% 60%,#dff2e8 0 14px,transparent 15px),radial-gradient(circle at 30% 85%,#ffeccf 0 12px,transparent 13px),var(--bg)}
  body.theme-bunny .topbar{border-radius:0 0 28px 28px}
  body.theme-bunny .deck,body.theme-bunny .card,body.theme-bunny .face,body.theme-bunny .back{border-radius:32px}
  body.theme-bunny .deck{box-shadow:0 14px 28px rgba(210,150,130,.35)}
  body.theme-bunny .deck::after,body.theme-bunny .back::after{border:3px dashed rgba(255,255,255,.8);border-radius:24px;background:radial-gradient(circle,rgba(255,255,255,.45) 0 4px,transparent 5px) 0 0/22px 22px}
  body.theme-bunny .face{border:4px solid #f4d8cc;box-shadow:0 14px 28px rgba(210,150,130,.35)}
  body.theme-bunny .choice{color:#6e5046;background:linear-gradient(rgba(255,240,232,.97),rgba(255,240,232,.9) 70%,transparent)}
  body.theme-bunny .who{color:#a0606a;letter-spacing:.06em}
  body.theme-bunny .bottom,body.theme-bunny .question.reply{color:#a0606a}
  body.theme-bunny .screen{background:#fff6ec;color:#6e5046}
  body.theme-bunny .btn{border-color:#ee8f9b;color:#fff;background:#ee8f9b;border-radius:999px}
  body.theme-bunny .btn:hover{background:#e57885;color:#fff}
  body.theme-bunny .log li{border-top-color:#f1d6cb}
  body.theme-bunny .bill{border-color:#ee8f9b;border-radius:20px}
  body.theme-bunny .bill .bh,body.theme-bunny .bill .bt{color:#c0606e;border-color:#ee8f9b}
  /* ===== 主題：剪紙動物版（整包切換）===== */
  body.theme-paper{--bar:#f4eee0;--bar-ink:#1e1e1e;--icon-empty:#e6dcc6;--icon-full:#2e54aa;--bg:#f4eee0;--card-back:#e2533f;--ink:#1e1e1e;--cream:#fbf8f0;
    font-family:"BOBHuninn1","BOBHuninn2","BOBHuninn3","PingFang TC","Microsoft JhengHei",sans-serif}
  body.theme-paper .app{background:var(--bg)}
  body.theme-paper .topbar{border-bottom:3px solid #1e1e1e}
  body.theme-paper #st-births{--icon-full:#e896a0} body.theme-paper #st-money{--icon-full:#d6a828}
  body.theme-paper .deck,body.theme-paper .card,body.theme-paper .face,body.theme-paper .back{border-radius:0}
  body.theme-paper .deck{box-shadow:8px 8px 0 #1e1e1e}
  body.theme-paper .face{border:3px solid #1e1e1e;box-shadow:8px 8px 0 #1e1e1e}
  body.theme-paper .back::after,body.theme-paper .deck::after{border:3px solid #f4eee0;border-radius:0;background:radial-gradient(circle,#d6a828 0 6px,transparent 7px) 0 0/40px 40px}
  body.theme-paper .choice{color:#1e1e1e;background:linear-gradient(rgba(251,248,240,.97),rgba(251,248,240,.9) 70%,transparent)}
  body.theme-paper .who{color:#fbf8f0;background:#e2533f;align-self:center;padding:3px 12px;margin-top:12px;letter-spacing:.06em}
  body.theme-paper .bottom,body.theme-paper .question.reply{color:#2e54aa}
  body.theme-paper .screen{background:#f4eee0;color:#1e1e1e}
  body.theme-paper .btn{border:3px solid #1e1e1e;color:#fbf8f0;background:#2e54aa;border-radius:0;box-shadow:4px 4px 0 #1e1e1e}
  body.theme-paper .btn:hover{background:#e2533f;color:#fbf8f0}
  body.theme-paper .log li{border-top-color:#d9cfb8}
  body.theme-paper .bill{border:3px solid #1e1e1e;border-radius:0;box-shadow:5px 5px 0 #1e1e1e;background:#fbf8f0}
  body.theme-paper .bill .bh,body.theme-paper .bill .bt{color:#e2533f;border-color:#1e1e1e}
  .pport{width:100%;height:100%;position:relative}
  .pport img{width:100%;height:100%;object-fit:cover;display:block}
  .pport.event{box-shadow:inset 0 0 0 10px #e2533f}
  body.theme-paper .keyart{display:block;border-radius:0;border:3px solid #1e1e1e;box-shadow:6px 6px 0 #1e1e1e}
  .bport{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
  .bport::before{content:"";position:absolute;width:72%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.55)}
  .bport img{position:relative;width:96%;height:auto;display:block}
  .bport.event{box-shadow:inset 0 0 0 8px #f5a3ae}
  .keyart{display:none;width:100%;max-width:400px;border-radius:24px;margin-bottom:18px;box-shadow:0 10px 24px rgba(210,150,130,.3)}
  body.theme-bunny .keyart{display:block}
  .themes{display:flex;gap:10px;margin-top:22px;justify-content:center}
  .themes button{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:2px solid currentColor;background:none;color:inherit;opacity:.55;cursor:pointer}
  .themes button.on{opacity:1;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar">
    <div class="stat" id="st-births"><div class="dot"><i></i></div>
      <svg viewBox="0 0 44 44"><defs><clipPath id="c-births"><rect id="r-births" x="0" y="44" width="44" height="44"/></clipPath></defs>
        <g id="g-births"><circle cx="22" cy="14" r="9"/><path d="M8 40c0-9 6-15 14-15s14 6 14 15z"/><circle cx="22" cy="5" r="2.5"/></g>
        <use href="#g-births" fill="var(--icon-empty)"/><use href="#g-births" fill="var(--icon-full)" clip-path="url(#c-births)"/></svg>
      <div class="lbl">出生</div></div>
    <div class="stat" id="st-patience"><div class="dot"><i></i></div>
      <svg viewBox="0 0 44 44"><defs><clipPath id="c-patience"><rect id="r-patience" x="0" y="44" width="44" height="44"/></clipPath></defs>
        <g id="g-patience"><path d="M22 39 6 23C1 18 2 9 9 7c5-1.5 9 1 13 6 4-5 8-7.5 13-6 7 2 8 11 3 16z"/></g>
        <use href="#g-patience" fill="var(--icon-empty)"/><use href="#g-patience" fill="var(--icon-full)" clip-path="url(#c-patience)"/></svg>
      <div class="lbl">耐心</div></div>
    <div class="stat" id="st-money"><div class="dot"><i></i></div>
      <svg viewBox="0 0 44 44"><defs><clipPath id="c-money"><rect id="r-money" x="0" y="44" width="44" height="44"/></clipPath></defs>
        <g id="g-money"><ellipse cx="22" cy="34" rx="16" ry="6"/><rect x="6" y="22" width="32" height="12"/><ellipse cx="22" cy="22" rx="16" ry="6"/><rect x="6" y="12" width="32" height="10"/><ellipse cx="22" cy="12" rx="16" ry="6"/></g>
        <use href="#g-money" fill="var(--icon-empty)"/><use href="#g-money" fill="var(--icon-full)" clip-path="url(#c-money)"/></svg>
      <div class="lbl">財政</div></div>
    <div class="debt" id="debt">有些帳，還沒算。</div>
  </div>

  <div class="question" id="question"></div>
  <div class="stage" id="stage">
    <div class="deck"></div>
    <div class="card" id="card">
      <div class="face"><div id="portrait"></div><div class="choice l" id="choiceL"></div><div class="choice r" id="choiceR"></div></div>
      <div class="back"></div>
    </div>
    <div class="hint" id="hint">← 拖曳卡片做決定 →</div>
  </div>
  <div class="who" id="who"></div>
  <div class="bottom"><div class="yr" id="yr">2018</div><div class="sub" id="sub">執政第 1 張</div></div>

  <section class="screen" id="start">
    <img class="keyart" id="keyart" alt="" src="">
    <h1>少子女化拯救器</h1><div class="en">BABY OR BUST</div>
    <p>2018 年，你當上行政院長。左右滑動每一張卡，做出決定。<br>三個指標，任一歸零或爆表，你就下台。</p>
    <button class="btn" id="startBtn">開始執政</button>
    <div class="themes" id="themes"><button data-theme="classic">經典版</button><button data-theme="bunny">兔兔版</button><button data-theme="paper">剪紙版</button></div>
  </section>
  <section class="screen end hidden" id="end"></section>
</div>
<script>
"use strict";
      var METERS = [
        { key: "births",   name: "出生人口", el: "m-births" },
        { key: "patience", name: "家長耐心", el: "m-patience" },
        { key: "money",    name: "財政",     el: "m-money" }
      ];

      var ENDINGS = {
        "births-low":   "出生人口歸零。產房先空了，這題不用再答了。",
        "patience-low": "家長耐心歸零。連署和抗議包圍行政院，你的政策，沒人再聽了。",
        "patience-high":"家長耐心爆表。期待被你養到無限大，任何政策都變成不夠。",
        "money-low":    "財政歸零。國家沒錢了，立法院把你的預算砍到見骨。",
        "money-high":   "財政爆表。錢多到管不住，查帳的人和監察院一起找上門。"
      };

      /* ================= 卡表 =================
         kind: main 主線 / cons 後果 / event 事件
         fx: {births, patience, money}；debt: 品質債增減（隱藏）        */

      var MAIN = [
        {
          id: "S1", kind: "main", year: "2018", who: "行政院政務委員 林萬億",
          q: "「蓋公立幼兒園要好幾年，爸媽現在就要繳學費。要不要先每月直接發 2,500 元給家長？先解大家的燃眉之急。」",
          left:  { label: "堅持公共化幼兒園", reply: "家長上街，別怪我。", fx: { money: -5, patience: -13 } },
          right: { label: "先發錢給家長", reply: "發錢最快！這個月民調就見效。",     fx: { births: 1, money: -10, patience: 8 } },
          history: "right",
          fact: "現實中，政府選了「先發錢給家長」。其實每月 2,500 元的津貼 2012 年就有，2018 年改的是放寬誰能領；找私立幼兒園合作、多蓋公立幼兒園也同一天上路，三件事一起做。後面每一張卡，都是這個決定寄來的帳單。",
          source: "《我國少子女化對策計畫（107–111 年）》（行政院 2018 年核定）「擴大育兒津貼」：2018 年 8 月起取消父母一方須未就業的限制，2019 年 8 月延到未滿 5 歲，每月 2,500 元；行政院 2018-07-27 新聞稿（林萬億：「不只是發錢了事」）。"
        },
        {
          id: "S2", kind: "main", year: "2018", who: "私立幼兒園業者",
          q: "「我們私立幼兒園願意跟政府合作，學費壓到每月 4,500 以內，馬上多出一堆便宜名額。條件是：政府別常來查我們。」",
          left:  { label: "要合作就得被查", reply: "管這麼死？那我們不玩了。", fx: { money: -7, patience: 2 } },
          right: { label: "先合作，承諾少查", reply: "成交！下週就掛牌！",     fx: { money: -9, patience: 9 }, debt: 2 },
          history: "right",
          fact: "現實中，政府選了「先合作，承諾少查」。跟政府合作的私立幼兒園，從 2018 學年的 310 家變成 2024 學年的 2,039 家，比一般私立幼兒園還多。便宜名額多了多少？政府公布過 36 萬、52.6 萬、52 萬，但每次算的年份和孩子年齡範圍都不一樣，很難直接比。",
          source: "計畫核定本「建置托育準公共化機制」：私幼簽約加入、家長每月自付不超過 4,500 元（園方收費上限 8,000–10,000 元，差額由政府補）；準公共園數見監察院 2026-04-16 調查簡報。"
        },
        {
          id: "S4", kind: "main", year: "2021", who: "執政黨立委",
          q: "「每月育兒補助從 3,500 加到 5,000，爸媽一定開心。但這筆錢加了就減不回來，以後每年都要付。」",
          left:  { label: "不加，省下來", reply: "不加？民調掉下來誰負責？", fx: { money: 6, patience: -13 } },
          right: { label: "加到 5,000", reply: "加就對了！宣傳打滿，錢再想辦法。", fx: { births: 1, money: -12, patience: 8 } },
          history: "right",
          fact: "現實中，政府選了「加到 5,000」。2021 年 2 月一次拍板：當年 8 月從 2,500 加到 3,500，2022 年 8 月再加到 5,000。",
          source: "行政院 2021-02-04 院會通過少子女化對策計畫 110 年修正案：育兒津貼 2,500 元 → 3,500 元（2021-08）→ 5,000 元（2022-08），就學費用上限降至 3,000 元。"
        },
        {
          id: "S3", kind: "main", year: "2021", who: "私立幼兒園園長",
          q: "「疫情升到三級警戒，幼兒園全部停課。家長要我退學費，老師要領薪水，政府說可以借錢，補助又不夠，幹嘛不直接給？」",
          left:  { label: "政府直接發錢救園", reply: "老師薪水發得出來了。", fx: { money: -11, patience: 5 } },
          right: { label: "家長跟園所自己談", reply: "自己談？家長天天在門口拍桌！", fx: { money: 2, patience: -8 } },
          fact: "2021 年全國幼兒園停課約十週（5 月 19 日起，7 月 27 日才有條件復課）。政府借錢給園所，也直接補助人事費，每名全職人員最高 4 萬元；學費怎麼退，各縣市算法都不一樣。",
          source: "教育部 2021 年因應三級警戒之幼兒園停課退費處理與紓困措施。"
        },

    if (!state.firedEvents.E3 && state.mainPlayed>=3 && state.values.money<=20) ev=EVENTS.E3;
    else if (!state.firedEvents.E1 && state.mainPlayed>=4 && state.debt>=3) ev=EVENTS.E1;
    else if (!state.firedEvents.E2 && !(state.consFired&&state.consFired.K4) && state.mainPlayed>=4 && state.debt>=5) ev=EVENTS.E2;
    if (ev) { state.firedEvents[ev.id]=true; state.eventsFired+=1; state.queue.unshift(ev); }
  }
}

/* 數值邏輯與 index.html 完全相同（搖擺稅、品質債、期待通膨、信任崩壞、全分辨率後判定） */
function resolve(side){
  var c = state.current, opt = c[side];
  var prevSide = state.picks.length ? state.picks[state.picks.length-1].side : null;
  var swingTax = (prevSide && prevSide !== side) ? -4 : 0;
  if (opt.debt) state.debt = Math.max(0, state.debt + opt.debt);
  var e1Extra = (c.id==="E1" && side==="right" && state.debt>=4) ? -6 : 0;
  state.picks.push({card:c, side:side});
  var cardNo = state.playedCount + 1, inflation = cardNo <= 6 ? -2 : -3, scandalExtra = state.scandal ? -1 : 0;
  var totals = {births:0, patience:0, money:0}, k;
  for (k in opt.fx) { state.values[k] += opt.fx[k]; totals[k] += opt.fx[k]; }
  state.values.patience += swingTax + e1Extra + inflation + scandalExtra; totals.patience += swingTax + e1Extra + inflation + scandalExtra;
  state.values.births -= 2; totals.births -= 2;
  state.playedCount += 1; if (c.kind==="main") state.mainPlayed += 1;
  renderStats(totals);
  state.ending = checkEnding();
  if (!state.ending) scheduleConsequences(c, side);
}

function commit(side){
  if (state.busy) return; state.busy = true;
  var card = $("card"), dir = side==="left" ? -1 : 1;
  card.style.transition = "transform .35s ease-in";
  card.style.transform = "translateX("+(dir*520)+"px) rotate("+(dir*30)+"deg)";
  showDots(null);
  var reply = state.current[side].reply;
  resolve(side);
  if (reply) { var qe=$("question"); qe.classList.add("reply"); qe.textContent = "「"+reply+"」"; }
  setTimeout(function(){
    $("question").classList.remove("reply");
    if (state.ending) return renderEnd(false);
    if (!state.queue.length) return renderEnd(true);
    drawCard();
  }, reply ? 1500 : 380);
}

/* drag */
(function(){
  var card = $("card"), startX = 0, dx = 0, down = false;
  function setDrag(x){
    dx = x; var w = card.offsetWidth, ratio = Math.max(-1, Math.min(1, dx / (w*0.6)));
    card.style.transform = "translateX("+(dx*0.6)+"px) rotate("+(ratio*12)+"deg)";
    $("choiceL").style.opacity = ratio < 0 ? Math.min(1, -ratio*2) : 0;
    $("choiceR").style.opacity = ratio > 0 ? Math.min(1, ratio*2) : 0;
    showDots(Math.abs(ratio) > 0.12 ? (ratio < 0 ? "left" : "right") : null);
  }
  card.addEventListener("pointerdown", function(e){ if(!state||state.busy) return; down=true; startX=e.clientX; dx=0;
    card.setPointerCapture(e.pointerId); card.classList.add("dragging"); card.style.transition="none"; $("hint").style.opacity=0; });
  card.addEventListener("pointermove", function(e){ if(down) setDrag(e.clientX - startX); });
  function up(){ if(!down) return; down=false; card.classList.remove("dragging");
    if (Math.abs(dx) > card.offsetWidth*0.35) commit(dx < 0 ? "left" : "right");
    else { card.style.transition="transform .25s"; card.style.transform="none"; $("choiceL").style.opacity=0; $("choiceR").style.opacity=0; showDots(null); } }
  card.addEventListener("pointerup", up); card.addEventListener("pointercancel", up);
  document.addEventListener("keydown", function(e){
    if (!state || state.busy || $("start").classList.contains("hidden")===false || !$("end").classList.contains("hidden")) return;
    if (e.key==="ArrowLeft"||e.key==="ArrowRight"){ var s = e.key==="ArrowLeft"?"left":"right";
      setDrag((s==="left"?-1:1)*card.offsetWidth*0.4); setTimeout(function(){ commit(s); }, 160); }
  });
})();

function renderEnd(completed){
  var h = "";
  if (!completed) { h += '<div class="death">'+ENDINGS[state.ending]+'</div><div class="meta">'+state.year+' · 你倒在第 '+state.picks.length+' 張卡</div>'; }
  else { h += '<div class="death">你撐完了八年。<br>但出生人口還在往下。錢花得最多，生育率史上最低。</div><div class="meta">出生 '+state.values.births+' · 耐心 '+state.values.patience+' · 財政 '+state.values.money+'</div>'; }
  h += '<div class="bill"><div class="bh">這八年的帳單</div>'
    + '<div class="br"><b>2018</b>育兒補助每月 2,500 元</div>'
    + '<div class="br"><b>2022</b>加到每月 5,000 元</div>'
    + '<div class="br"><b>2026</b>0 到 18 歲成長津貼 1,853 億元</div>'
    + '<div class="br"><b>2026</b>私幼每月 15,000 提案，一年再 423 億元（協商中）</div>'
    + '<div class="bt">少子女化預算 198.8 億 → 3,666.7 億<br>生育率 1.125 → 0.695</div></div>';
  h += '<ul class="log">';
  state.picks.forEach(function(p,i){
    var c=p.card;
    h += '<li><div class="h">'+(i+1)+'. '+(c.year?c.year+' ':'')+c.who+'</div><div class="pick">你選了「'+c[p.side].label+'」';
    if (c.history) h += '<span class="tag">'+(p.side===c.history?'與史實同向':'史實選「'+c[c.history].label+'」')+'</span>';
    else if (c.open) h += '<span class="tag">現實還沒決定</span>';
    h += '</div><div class="fact">'+c.fact+'</div></li>';
  });
  h += '</ul><button class="btn" id="again">再來一次</button><div style="height:30px"></div>';
  $("end").innerHTML = h; $("end").classList.remove("hidden"); $("end").scrollTop = 0;
  $("again").addEventListener("click", startGame);
}
function startGame(){ state = freshState(); state.busy = true; $("start").classList.add("hidden"); $("end").classList.add("hidden"); renderStats(null); drawCard(); }
$("startBtn").addEventListener("click", startGame);
(function(){
  var q = (location.search.match(/[?&]theme=(\w+)/)||[])[1], saved = null;
  try { saved = localStorage.getItem("bob-theme"); } catch(e){}
  setTheme(q || saved || "classic");
  $("themes").addEventListener("click", function(e){ var t = e.target.getAttribute && e.target.getAttribute("data-theme"); if (t) setTheme(t); });
})();
</script>
