<style>
:root{--ink:#333;--paper:#fbfaf6;--line:#cfcabd;--off:#8a857a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#e9e6de;color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100%;background:var(--paper);

.sk{filter:url(#rough)}

.box{border:2px solid var(--ink);border-radius:10px 14px 9px 13px;background:#fff;padding:14px;margin:12px 0;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tag{display:inline-block;font-size:11px;border:1.5px solid var(--ink);border-radius:9px;padding:1px 8px;margin-bottom:6px}
.news .tag{background:#333;color:#fff}
.news h3{margin:4px 0;font-size:18px;line-height:1.45}
.src{font-size:11px;color:var(--off);margin-top:8px;line-height:1.5}
.real{font-size:10px;border:1px solid var(--off);border-radius:6px;padding:0 4px;margin-left:4px;color:var(--off)}
.fake{font-size:10px;border:1px dashed #c55;border-radius:6px;padding:0 4px;margin-left:4px;color:#c55}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--off);margin-bottom:6px}
.q{font-size:17px;line-height:1.6}
.opts{display:flex;gap:10px;margin-top:14px}
.opt{flex:1;border:2px solid var(--ink);border-radius:12px 8px 13px 9px;background:var(--paper);padding:12px 8px;font-size:15px;font-weight:600;cursor:pointer;text-align:center}
.opt small{display:block;font-weight:400;font-size:11px;color:var(--off);margin-top:4px}
.opt:active{transform:scale(.97)}
.chosen{background:#333;color:#fff}.chosen small{color:#ddd}
.dim{opacity:.35;pointer-events:none}
.post .acct{font-weight:700;font-size:14px}
.post .acct span{font-weight:400;color:var(--off);font-size:12px}
.adimg{margin:10px 0;border:2px dashed var(--ink);border-radius:8px;padding:18px 12px;text-align:center;font-size:20px;font-weight:800;line-height:1.5;background:#fffef7}
.likes{font-size:12px;color:var(--off)}
.cm{display:flex;gap:8px;align-items:flex-start;margin-top:10px;animation:in .3s ease}
.cm b{font-size:13px}.cm p{margin:2px 0 0;font-size:14px;line-height:1.5}
.cm .pro{font-size:10px;color:#3a7;border:1px solid #3a7;border-radius:6px;padding:0 4px;margin-left:4px}
.next{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);border:2px solid var(--ink);background:#fff;border-radius:22px 18px 23px 17px;padding:12px 30px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 #333}
.next[hidden]{display:none}
.photo{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;margin:8px 0}
.fig{text-align:center;font-size:12px;width:50px}
.fig.gone{opacity:.25}
.fig.gone .nm{text-decoration:line-through}
.end h2{text-align:center;font-size:20px;margin:6px 0}
.small{font-size:13px;color:var(--off);text-align:center;line-height:1.6}
.bar{display:flex;justify-content:space-around;margin:10px 0 0;padding:8px 4px;border:1.5px dashed var(--off);border-radius:10px;font-size:11px;text-align:center}
.bar div{width:54px}.bar .st{display:block;color:var(--off);margin-top:2px}
.bar .warn{color:#c55}.boss{font-size:12px;color:var(--off);text-align:center;margin-top:6px}
.gov{background:#f3f1ea}.gov .tag{background:#fff}
.chosen .adimg{color:#333}
.slot{margin-top:10px;border:1.5px dashed var(--line);border-radius:8px;padding:8px;font-size:12px;color:#bbb}
.tog{margin-top:12px;font-size:13px;text-align:center;border:1.5px dashed var(--off);border-radius:10px;padding:8px;cursor:pointer;color:var(--off)}
.tog.on{border-color:#c55;color:#c55;font-weight:700}
.two{display:flex;gap:6px}.two>div{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:6px 2px}
.two .photo .fig{width:30px;font-size:10px}
.two h4{margin:2px 0;text-align:center;font-size:13px}
.round{text-align:center;font-size:22px;font-weight:800;margin:30px 0 4px}
.boss-cm{border-top:1px dashed var(--line);margin-top:10px;padding-top:6px}
</style></head>

var app=document.getElementById("app"),nx=document.getElementById("next");

function add(html){var d=document.createElement("div");d.innerHTML=html;var el=d.firstElementChild;app.appendChild(el);setTimeout(function(){el.scrollIntoView({behavior:"smooth",block:"end"})},30);return el}
function wait(ms){return new Promise(function(r){setTimeout(r,FAST?1:ms)})}
function btn(label){return new Promise(function(r){nx.textContent=label;nx.hidden=false;nx.onclick=function(){nx.hidden=true;r()}})}

   var tg=box2.querySelector("#tog");
   if(tg)tg.onclick=function(){truth=!truth;tg.classList.toggle("on",truth);tg.textContent=(truth?"☑":"☐")+" 這次叫小編說實話（只能一次，你會下台）"};
   k=await choose(box2,".opt");if(tg){tg.onclick=null;tg.removeAttribute("id")}
   opt=n[k];nice=!truth;author="小編";
  }
 }
 await wait(400);
 var p=post(author,nice?opt.nice:opt.honest,nice);
 await comments(p,opt.cm);
 opt.hurt.forEach(function(h){hurt[h]+=nice?2:1});
 log.push({year:n.year,label:opt.label,history:!!opt.history,nice:nice,by:author});
 await wait(500);
 if(ROUND===1&&!out){boss+=nice?1:-1;
  bossSay(p,nice?"這篇寫得好，數據很漂亮。":(boss<=-2?"老顏，你下週去檔案室報到。粉專交給新來的。":"這篇誰准的？下次先給我看。"),nice?"smile":"sad");
  if(boss<=-2)out=true;}
 if(ROUND===2&&truth){usedTruth=true;out=true;await wait(300);bossSay(p,"部長：這篇誰准的？你明天不用來了。","sad");}
 await wait(500);bar();
 await btn("下一年");
}
async function playRound(){
 reset();
 add('<div class="round">第 '+ROUND+' 輪｜你是'+(ROUND===1?'小編':'長官')+'</div>');
 if(ROUND===1){
  add('<div class="yr">— 2018 夏・總統府前 —</div>');
  add('<div class="box">'+photo()+'<div class="small">國小同學合照。背後是總統府。</div></div>');
  var b=add('<div class="box post"><div class="who">'+fig("阿芳",{head:1,s:28})+'<div class="acct">阿芳</div></div><p style="margin:4px 0">老顏去少子女化對策辦公室上班了！以後我們生小孩靠你啦～</p></div>');
  await comments(b,[["家豪","恭喜顏座🎉",1]]);
  add('<div class="box post"><div class="who">'+fig("長官",{head:1,s:28,mood:"flat"})+'<div class="acct">長官</div></div><p style="margin:4px 0">粉專交給你。政策上面會決定，你負責寫。</p></div>');
 }else{
  add('<div class="box post"><div class="who">'+fig("長官",{head:1,s:28,mood:"smile"})+'<div class="acct">回到 2018</div></div><p style="margin:4px 0">這次政策由你決定。粉專有新小編，他只會寫好聽的。</p></div>');
 }
 await btn("開始");
 for(var i=0;i<ORDER.length;i++){var o=ORDER[i];
  if(o[0]==="n")await decision(NODES[o[1]]);else await autoYear(YEARS[o[1]]);}
 add('<div class="yr">— 2026 —</div>');news(FINAL);await wait(600);
 var gone=CAST.filter(function(n){return hurt[n]>=3}),unf=CAST.filter(function(n){return hurt[n]===2});
 RESULT.push({round:ROUND,gone:gone,unf:unf,out:out,log:log.slice(),hurt:JSON.parse(JSON.stringify(hurt))});
 await btn("同學會");
 add('<div class="yr">— 2026・同學會 —</div>');
 add('<div class="box end"><h2>又站到總統府前了</h2>'+photo(gone)+'<div class="small">'+(gone.length?gone.join("、")+' 沒來。':'大家都來了。')+(unf.length?'<br>'+unf.join("、")+' 來了，但已經退追蹤你。':'')+(out?(ROUND===1?'<br>你被調去檔案室了。':'<br>你下台了。'):'')+'</div></div>');
 add('<div class="box post"><div class="who">'+fig("阿芳",{head:1,s:28})+'<div class="acct">阿芳</div></div><p style="margin:4px 0">八年了，本班多了 '+KIDS+' 個小朋友。'+(ROUND===1?'粉專的字，我們都看到了。':'你都是我們的好同學。')+'</p></div>');
}
async function run(){
 await playRound();
 await wait(600);
 add('<div class="box"><div class="q" style="text-align:center">如果是你決定呢？</div></div>');
 await btn("當長官重來");
 app.innerHTML="";ROUND=2;
 await playRound();
 await wait(600);
 var a=RESULT[0],b=RESULT[1];
 add('<div class="yr">— 兩次同學會 —</div>');
 add('<div class="box"><div class="two"><div><h4>小編的你</h4>'+photo(a.gone)+'<div class="small">缺席 '+a.gone.length+'・退追蹤 '+a.unf.length+'</div></div><div><h4>長官的你</h4>'+photo(b.gone)+'<div class="small">缺席 '+b.gone.length+'・退追蹤 '+b.unf.length+'</div></div></div><div class="small" style="margin-top:8px">本班小朋友：兩次都是 '+KIDS+' 個。<br>權力改變的是誰受傷，不是有沒有人受傷。</div></div>');
 await wait(800);
 var c=add('<div class="box"><div class="q">那你自己呢？</div><div class="opts"><div class="opt" data-k="Y">生</div><div class="opt" data-k="N">不生</div></div></div>');
 var k=await choose(c,".opt");
 add('<div class="small" style="margin:18px 0">'+(k==="Y"?"你按下了「生」。津貼一個月 5,000，保母兩萬。":"你按下了「不生」。跟本班大部分人一樣。")+'<br><br>（POC v3 到此結束）</div>');
 nx.textContent="再玩一次";nx.hidden=false;nx.onclick=function(){location.reload()};
}
window.__S=function(){return {round:ROUND,hurt:hurt,boss:boss,out:out,usedTruth:usedTruth,log:log,result:RESULT}};
run();

</script></body></html>
